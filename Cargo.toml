[package]
name = "practice"
version = "0.1.0"
edition = "2024"
nightly = true


[dependencies]
chron = "0.1.6"
twox-hash = "2.1.5"
utf8_slice = "1.0.0"

[profile.dev]
opt-level = 0
debug = "full"
debug-assertions = true
overflow-checks = true
strip = "none"
lto = false
incremental = false

[profile.test]
opt-level = 0
debug = "full"
debug-assertions = true
overflow-checks = true
strip = "none"
lto = false
incremental = false
